[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-playground"
version = "0.1.0"
description = "Readable NumPy implementations of core machine-learning algorithms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shlok Bhutani" }]
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
